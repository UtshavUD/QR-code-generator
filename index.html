<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-code-generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>QR-Code-Generator</h2>
        <div class="help-wrapper">
    <button class="help-btn" onclick="toggleHelp()">How to use ?</button>
</div>

<div class="help-box" id="helpBox">
    <h3>How to Use QR Generator:</h3><hr><br>
    <ol>
        <li>Enter text or URL in the input field.</li>
        <li>Click on "Generate QR code".</li>
        <li>Your QR code will appear below.</li>
        <li>Scan it using any QR scanner.</li>
    </ol>
</div>
        <p>Enter your text or URL</p>

        <input type="text" placeholder="abcd@gmail.com" id="qrText">

        <div class="imgBox" id="imgBox">
            <img src="" id="qrImage">
        </div>

        <button onclick="generateQR()" type="submit">Generate QR code</button>
        <button onclick="downloadQR()" id="downloadBtn" style="display:none;">
    Download QR
</button>
    </div>

    <script>

         let imgBox=document.getElementById("imgBox");
         let qrImage=document.getElementById("qrImage");
         let qrText=document.getElementById("qrText");

        function generateQR(){

            if(qrText.value.length>0){

            qrImage.src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + qrText.value;
            imgBox.classList.add("show-img");

            document.getElementById("downloadBtn").style.display = "inline-block";

                }
                else{
                    qrText.classList.add('error');
                    setTimeout(()=>{
                        qrText.classList.remove('error');                        
                    },1000)
                }
            }

            function toggleHelp(){
    let helpBox = document.getElementById("helpBox");
    helpBox.classList.toggle("show");
}

async function downloadQR(){

    if(!qrImage.src) return;

    try{
        const response = await fetch(qrImage.src);
        const blob = await response.blob();

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "qr-code.png";
        document.body.appendChild(a);
        a.click();

        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }
    catch(error){
        alert("Download failed!");
    }
}


    </script>

    
</body>
</html>
